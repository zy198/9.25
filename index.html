<body>

<!-- 背景星星 -->

<script>
// =====================================================================
// 1. 全局配置 & 状态
// =====================================================================
let C = {
  word: '家人们', count: 300, minF: 10, maxF: 26, glow: 12,
  color: '#ff69b4', greet: '中秋节快乐', gSize: 52, gColor: '#ff1493',
  imgW: 220, imgSrc: '', flicker: true, particles: true, twinkle: true, pulse: true
};
let dirty = true;
let dpr = window.devicePixelRatio || 1;

// =====================================================================
// 2. 初始化
// =====================================================================
window.addEventListener('DOMContentLoaded', () => {
  loadCfg();
  syncUI();
  // 设置画布CSS尺寸
  setMoonCssSize();
  setMainCssSize();
  // 初始化所有画布
  initMoonCanvas();
  initMainCanvas();
  initBgCanvas();
  initBottomCanvas();
  generate();
  requestAnimationFrame(loop);
});

window.addEventListener('resize', () => {
  initMoonCanvas();
  initMainCanvas();
  initBgCanvas();
  initBottomCanvas();
  dirty = true;
});

// =====================================================================
// 3. 本地存储
// =====================================================================
function loadCfg() {
  try { const s = localStorage.getItem('mq_cfg'); if (s) C = {...C, ...JSON.parse(s)}; } catch(e) {}
}
function saveCfg() { localStorage.setItem('mq_cfg', JSON.stringify(C)); }

function syncUI() {
  document.getElementById('f-word').value = C.word;
  document.getElementById('f-count').value = C.count;
  document.getElementById('f-minf').value = C.minF;
  document.getElementById('f-maxf').value = C.maxF;
  document.getElementById('f-glow').value = C.glow;
  document.getElementById('f-color').value = C.color;
  document.getElementById('f-greet').value = C.greet;
  document.getElementById('f-gsize').value = C.gSize;
  document.getElementById('f-gcolor').value = C.gColor;
  document.getElementById('f-imgw').value = C.imgW;
  document.getElementById('f-url').value = C.imgSrc;
  document.getElementById('f-flicker').checked = C.flicker;
  document.getElementById('f-particles').checked = C.particles;
  document.getElementById('f-twinkle').checked = C.twinkle;
  document.getElementById('f-pulse').checked = C.pulse;
  updateVal('v-count', C.count);
  updateVal('v-minf', C.minF+'px');
  updateVal('v-maxf', C.maxF+'px');
  updateVal('v-glow', C.glow);
  updateVal('v-gsize', C.gSize+'px');
  updateVal('v-imgw', C.imgW+'px');
}
function updateVal(id, v) { document.getElementById(id).textContent = v; }

// =====================================================================
// 4. 读取UI → 配置
// =====================================================================
function readUI() {
  C.word = document.getElementById('f-word').value.trim() || '家人们';
  C.count = +document.getElementById('f-count').value;
  C.minF = +document.getElementById('f-minf').value;
  C.maxF = +document.getElementById('f-maxf').value;
  C.glow = +document.getElementById('f-glow').value;
  C.color = document.getElementById('f-color').value;
  C.greet = document.getElementById('f-greet').value.trim() || '中秋节快乐';
  C.gSize = +document.getElementById('f-gsize').value;
  C.gColor = document.getElementById('f-gcolor').value;
  C.imgW = +document.getElementById('f-imgw').value;
  C.flicker = document.getElementById('f-flicker').checked;
  C.particles = document.getElementById('f-particles').checked;
  C.twinkle = document.getElementById('f-twinkle').checked;
  C.pulse = document.getElementById('f-pulse').checked;
  saveCfg();
}

// =====================================================================
// 5. 顶部月亮 Canvas
// =====================================================================
let moonCanvas, moonCtx;
function setMoonCssSize() {
  const c = document.getElementById('moon-canvas');
  c.style.width = C.imgW + 'px';
  c.style.height = C.imgW + 'px';
}
function initMoonCanvas() {
  moonCanvas = document.getElementById('moon-canvas');
  moonCanvas.width = C.imgW * dpr;
  moonCanvas.height = C.imgW * dpr;
  moonCtx = moonCanvas.getContext('2d');
  drawMoon();
}
function drawMoon() {
  const ctx = moonCtx, w = moonCanvas.width, h = moonCanvas.height;
  ctx.clearRect(0, 0, w, h);
  if (C.imgSrc) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      ctx.clearRect(0,0,w,h);
      const grd = ctx.createRadialGradient(w/2,h/2,w*0.05,w/2,h/2,w/2);
      grd.addColorStop(0,'rgba(255,250,200,0.3)');
      grd.addColorStop(1,'rgba(255,200,50,0)');
      ctx.fillStyle = grd; ctx.fillRect(0,0,w,h);
      const sz = Math.min(w,h)*0.85;
      ctx.drawImage(img, (w-sz)/2, (h-sz)/2, sz, sz);
    };
    img.src = C.imgSrc;
    return;
  }
  // 默认月亮
  const grd = ctx.createRadialGradient(w/2,h/2,w*0.1,w/2,h/2,w/2);
  grd.addColorStop(0,'rgba(255,255,200,0.9)');
  grd.addColorStop(0.5,'rgba(255,220,100,0.5)');
  grd.addColorStop(1,'rgba(255,200,50,0)');
  ctx.fillStyle = grd; ctx.fillRect(0,0,w,h);

  ctx.beginPath();
  ctx.arc(w/2, h/2, w*0.3, 0, Math.PI*2);
  const mg = ctx.createRadialGradient(w*0.42,h*0.42,w*0.05,w/2,h/2,w*0.35);
  mg.addColorStop(0,'#FFFACD'); mg.addColorStop(0.7,'#FFD700'); mg.addColorStop(1,'#FFA500');
  ctx.fillStyle = mg; ctx.fill();

  ctx.fillStyle = '#8B4513';
  ctx.font = `bold ${Math.round(w*0.13)}px Microsoft YaHei`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('花好月圆', w/2, h/2+4);
}

// =====================================================================
// 6. 心形数学：拒绝采样法生成心形内部点
// =====================================================================
function generateHeartPoints(count, w, h) {
  const pts = [];
  let attempts = 0;
  const maxAttempts = count * 500;
  const cx = w / 2;
  const cy = h / 2 + h * 0.05;
  const scale = Math.min(w, h) * 0.42;
  while (pts.length < count && attempts < maxAttempts) {
    attempts++;
    const nx = (Math.random() * 2 - 1) * 1.5;
    const ny = (Math.random() * 2 - 1) * 1.5;
    const lhs = Math.pow(nx*nx + ny*ny - 1, 3);
    const rhs = nx*nx * Math.pow(ny, 3);
    if (lhs - rhs <= 0) {
      pts.push({ x: cx + nx * scale, y: cy - ny * scale });
    }
  }
  return pts;
}

// =====================================================================
// 7. 主画布：心形文字
// =====================================================================
let mainCanvas, mainCtx, mainW, mainH;
let wordItems = [];

function setMainCssSize() {
  const c = document.getElementById('main-canvas');
  c.style.width = '70vmin';
  c.style.height = '70vmin';
}
function initMainCanvas() {
  mainCanvas = document.getElementById('main-canvas');
  const rect = mainCanvas.getBoundingClientRect();
  mainW = Math.round(rect.width * dpr);
  mainH = Math.round(rect.height * dpr);
  mainCanvas.width = mainW;
  mainCanvas.height = mainH;
  mainCtx = mainCanvas.getContext('2d');
}
function buildWordItems() {
  const pts = generateHeartPoints(C.count, mainW, mainH);
  wordItems = pts.map(p => ({
    text: C.word,
    x: p.x + (Math.random()-0.5) * dpr * 2,
    y: p.y + (Math.random()-0.5) * dpr * 2,
    size: (Math.random() * (C.maxF - C.minF) + C.minF) * dpr,
    baseOpacity: Math.random() * 0.4 + 0.6,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.02 + 0.01
  }));
}

function drawHeartGlow(ctx, time) {
  const cx = mainW/2, cy = mainH/2 + mainH*0.05;
  const r = Math.min(mainW, mainH) * 0.38;
  for (let i = 3; i >= 1; i--) {
    const grd = ctx.createRadialGradient(cx, cy, r*0.1, cx, cy, r*i*0.5);
    const a = 0.03 * (4-i);
    grd.addColorStop(0, `rgba(255,105,180,${a})`);
    grd.addColorStop(0.5, `rgba(255,20,147,${a*0.5})`);
    grd.addColorStop(1, 'rgba(255,20,147,0)');
    ctx.fillStyle = grd; ctx.fillRect(0,0,mainW,mainH);
  }
  // 心形轮廓描边
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.05) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    const sx = x * r * 0.06, sy = y * r * 0.06;
    if (t === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(255,105,180,0.08)';
  ctx.lineWidth = 2 * dpr;
  ctx.shadowColor = '#ff69b4'; ctx.shadowBlur = 10 * dpr;
  ctx.stroke();
  ctx.restore();
}

function drawHeartWords(ctx, time) {
  ctx.clearRect(0, 0, mainW, mainH);
  drawHeartGlow(ctx, time);

  ctx.globalCompositeOperation = 'lighter';
  wordItems.forEach(item => {
    let opa = item.baseOpacity;
    if (C.flicker) opa *= 0.6 + 0.4 * Math.sin(time * item.speed * 60 + item.phase);
    ctx.globalAlpha = opa;
    ctx.shadowColor = C.color;
    ctx.shadowBlur = C.glow * dpr;
    ctx.fillStyle = C.color;
    ctx.font = `bold ${item.size}px Microsoft YaHei`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(item.text, item.x, item.y);
    // 偶尔高亮白色
    if (C.twinkle && Math.sin(time * 3 + item.phase * 5) > 0.92) {
      ctx.shadowBlur = C.glow * dpr * 2;
      ctx.fillStyle = '#fff';
      ctx.fillText(item.text, item.x, item.y);
    }
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';
}

// =====================================================================
// 8. 背景星星
// =====================================================================
let bgCanvas, bgCtx, stars = [];
function initBgCanvas() {
  bgCanvas = document.getElementById('bg-canvas');
  bgCanvas.width = window.innerWidth * dpr;
  bgCanvas.height = window.innerHeight * dpr;
  bgCtx = bgCanvas.getContext('2d');
  stars = [];
  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height * 0.75,
      s: (Math.random() * 1.5 + 0.5) * dpr,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.01
    });
  }
}
function drawStars(ctx, time) {
  if (!C.twinkle) return;
  stars.forEach(st => {
    const a = 0.3 + 0.7 * Math.abs(Math.sin(time * st.speed * 60 + st.phase));
    ctx.globalAlpha = a * 0.6;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.s, 0, Math.PI*2); ctx.fill();
    if (a > 0.7) {
      ctx.strokeStyle = `rgba(255,255,200,${a*0.3})`;
      ctx.lineWidth = dpr * 0.8;
      ctx.beginPath();
      ctx.moveTo(st.x - st.s*4, st.y); ctx.lineTo(st.x + st.s*4, st.y);
      ctx.moveTo(st.x, st.y - st.s*4); ctx.lineTo(st.x, st.y + st.s*4);
      ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
}

// =====================================================================
// 9. 底部粒子
// =====================================================================
let botCanvas, botCtx, particles = [];
function initBottomCanvas() {
  botCanvas = document.getElementById('bottom-canvas');
  botCanvas.width = window.innerWidth * dpr;
  botCanvas.height = window.innerHeight * 0.35 * dpr;
  botCtx = botCanvas.getContext('2d');
  particles = [];
  const count = Math.round(botCanvas.width * 0.03);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * botCanvas.width,
      y: Math.random() * botCanvas.height,
      s: (Math.random() * 2 + 1) * dpr,
      vy: (Math.random() * 0.5 + 0.2) * dpr,
      vx: (Math.random() - 0.5) * 0.3 * dpr,
      a: Math.random() * 0.5 + 0.1,
      twinkle: Math.random() * Math.PI * 2,
      isHeart: Math.random() > 0.6,
      color: Math.random() > 0.5 ? '#ff69b4' : '#ff1493'
    });
  }
}
function drawTinyHeart(ctx, cx, cy, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 4 * dpr;
  ctx.beginPath();
  const s = size;
  ctx.moveTo(cx, cy + s*0.3);
  ctx.bezierCurveTo(cx, cy - s*0.1, cx - s*0.6, cy - s*0.5, cx - s*0.5, cy - s*0.1);
  ctx.bezierCurveTo(cx - s*0.4, cy + s*0.2, cx, cy + s*0.5, cx, cy + s*0.7);
  ctx.bezierCurveTo(cx, cy + s*0.5, cx + s*0.4, cy + s*0.2, cx + s*0.5, cy - s*0.1);
  ctx.bezierCurveTo(cx + s*0.6, cy - s*0.5, cx, cy - s*0.1, cx, cy + s*0.3);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawParticles(ctx, time) {
  const w = botCanvas.width, h = botCanvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!C.particles) return;
  particles.forEach(p => {
    p.y -= p.vy; p.x += p.vx; p.twinkle += 0.03;
    if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
    const alpha = p.a * (0.5 + 0.5 * Math.sin(p.twinkle));
    ctx.globalAlpha = alpha;
    if (p.isHeart) {
      drawTinyHeart(ctx, p.x, p.y, p.s * 2, p.color);
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2);
      ctx.fillStyle = p.color; ctx.fill();
      if (Math.sin(p.twinkle * 2) > 0.7) {
        ctx.strokeStyle = `rgba(255,255,255,${alpha*0.6})`;
        ctx.lineWidth = dpr;
        ctx.beginPath();
        ctx.moveTo(p.x - p.s*3, p.y); ctx.lineTo(p.x + p.s*3, p.y);
        ctx.moveTo(p.x, p.y - p.s*3); ctx.lineTo(p.x, p.y + p.s*3);
        ctx.stroke();
      }
    }
  });
  ctx.globalAlpha = 1;
}

// =====================================================================
// 10. 中心祝福语
// =====================================================================
function updateBlessing() {
  const el = document.getElementById('center-blessing');
  el.textContent = C.greet;
  el.style.fontSize = C.gSize + 'px';
  el.style.color = C.gColor;
  el.style.textShadow = `
    0 0 ${Math.round(C.gSize*0.2)}px #fff,
    0 0 ${Math.round(C.gSize*0.4)}px ${C.gColor},
    0 0 ${Math.round(C.gSize*0.8)}px ${C.gColor},
    0 0 ${Math.round(C.gSize*1.2)}px #ff1493
  `;
}

// =====================================================================
// 11. 生成主函数
// =====================================================================
function generate() {
  readUI();
  buildWordItems();
  updateBlessing();
  drawMoon();
  dirty = false;
}

// =====================================================================
// 12. 主渲染循环
// =====================================================================
const startTime = Date.now();
function loop() {
  const time = (Date.now() - startTime) / 1000;

  // 呼吸律动
  if (C.pulse) {
    const s = 1 + Math.sin(time * 1.5) * 0.015;
    document.getElementById('main-canvas').style.transform = `translate(-50%, -48%) scale(${s})`;
  }

  if (dirty) generate();

  // 三层画布分别绘制
  drawStars(bgCtx, time);
  drawHeartWords(mainCtx, time);
  drawParticles(botCtx, time);

  requestAnimationFrame(loop);
}

// =====================================================================
// 13. UI 交互
// =====================================================================
function togglePanel() {
  document.getElementById('panel').classList.toggle('open');
  document.getElementById('panel-tab').classList.toggle('open');
}
function onUpload(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { C.imgSrc = ev.target.result; document.getElementById('f-url').value = ''; drawMoon(); saveCfg(); };
  r.readAsDataURL(f);
}
function onUrlChange() { C.imgSrc = document.getElementById('f-url').value.trim(); drawMoon(); saveCfg(); }
function onImgW() {
  C.imgW = +document.getElementById('f-imgw').value;
  updateVal('v-imgw', C.imgW+'px');
  setMoonCssSize();
  initMoonCanvas();
  saveCfg();
}
function removeTopImg() { C.imgSrc = ''; document.getElementById('f-url').value=''; document.getElementById('f-upload').value=''; drawMoon(); saveCfg(); }
</script>
